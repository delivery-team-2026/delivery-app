<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التوصيل</title>
<style>
:root{--main:#ff7a1a;--main2:#ff4d6d;--bg:#f4f6fb;--text:#1d2433;--muted:#7a8399;--ok:#22c55e;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:30px}
.hidden{display:none!important}

/* شاشة الافتتاح */
#splash{position:fixed;inset:0;background:linear-gradient(135deg,var(--main),var(--main2));display:grid;place-items:center;color:#fff;z-index:99;transition:opacity .6s}
#splash.gone{opacity:0;pointer-events:none}
#splash .logo{font-size:72px;text-align:center;animation:bounce 1s infinite}
#splash p{font-size:26px;font-weight:bold;text-align:center;margin-top:8px;animation:fadeUp .8s both}

@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* الشاشات */
.view{animation:fadeUp .5s ease both}
header{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px rgba(255,77,109,.3);animation:slideDown .5s ease both}
header small{display:block;opacity:.85}
main{padding:14px;display:grid;gap:14px}

/* كروت */
.card{background:#fff;border-radius:var(--r);padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.06);animation:fadeUp .45s ease both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.1)}
.card h3{margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.6}
.empty{text-align:center;color:var(--muted);padding:30px}

/* الحقول والزراير */
input,textarea{width:100%;padding:12px;border:1px solid #dfe3ee;border-radius:12px;margin-bottom:10px;font-size:15px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px rgba(255,122,26,.2)}
textarea{min-height:80px;resize:vertical}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;font-size:16px;font-weight:bold;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{box-shadow:0 6px 16px rgba(255,77,109,.35)}
.btn:active{transform:scale(.96)}
.btn.small{width:auto;padding:9px 14px;font-size:14px}
.btn.ok{background:var(--ok)}
.btn.ghost,.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);padding:8px 12px;border-radius:10px;cursor:pointer}
.btn.grey{background:#8a93a8}
.btn.danger{background:#e5484d}
.link{background:none;border:0;color:var(--main);font-size:14px;cursor:pointer;margin-top:12px;text-decoration:underline}
button:disabled{opacity:.6}

/* الطلبات */
.tag{padding:4px 10px;border-radius:20px;font-size:12px;background:#eef1f8;color:#445;white-space:nowrap}
.tag.new{background:#fff3e0;color:#e65100;animation:pulse 1.4s infinite}
.tag.accepted{background:#e8efff;color:#2953c9}
.tag.out{background:#f1e8ff;color:#7c3aed}
.tag.delivered{background:#e8f9ef;color:#15803d}
.tag.cancelled{background:#fde8e8;color:#b91c1c}
.bar{height:8px;background:#eceff6;border-radius:9px;overflow:hidden;margin:12px 0}
.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--main),var(--main2));border-radius:9px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* تبويبات */
.tabs{display:flex;gap:8px;background:#fff;border-radius:14px;padding:6px;margin:14px 14px 0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:bold;color:var(--muted);cursor:pointer;transition:all .3s}
.tabs button.active{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;box-shadow:0 4px 12px rgba(255,77,109,.3)}
.earn-num{font-size:34px;font-weight:bold;color:var(--main2);margin-top:8px}

/* إشعار */
.toast{position:fixed;top:-90px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;background:#1d2433;color:#fff;padding:14px 18px;border-radius:14px;text-align:center;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:top .45s cubic-bezier(.34,1.56,.64,1)}
.toast.show{top:16px}
.toast.ok{background:var(--ok)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash"><div><div class="logo">🛵</div><p>التوصيل</p></div></div>
<div id="toast" class="toast"></div>

<!-- شاشة الدخول -->
<section id="authView" class="view hidden">
  <header><div><b>🛵 التوصيل</b><small>ادخل برقمك وباسوردك</small></div></header>
  <main>
    <form id="authForm" class="card">
      <h3 id="authTitle">دخول</h3>
      <input id="name" class="hidden" placeholder="اسمك">
      <input id="phone" type="tel" placeholder="رقم التليفون" required>
      <input id="password" type="password" placeholder="الباسورد (6 حروف أو أرقام على الأقل)" required minlength="6">
      <button id="authBtn" class="btn" type="submit">دخول</button>
      <button id="toggleMode" class="link" type="button">مش عندك حساب؟ سجّل هنا</button>
    </form>
  </main>
</section>

<!-- شاشة العميل -->
<section id="customerView" class="view hidden">
  <header><div><b id="welcome"></b><small>حساب عميل</small></div><button class="ghost" data-act="logout">خروج</button></header>
  <main>
    <div id="slotOrder"></div>
    <h3 style="margin-top:6px">طلباتي</h3>
    <div id="myOrders" style="display:grid;gap:14px"></div>
  </main>
</section>

<!-- شاشة المندوب -->
<section id="agentView" class="view hidden">
  <header><div><b id="agentName"></b><small>حساب مندوب</small></div><button class="ghost" data-act="logout">خروج</button></header>
  <div id="slotOrderA" style="padding:14px 14px 0"></div>
  <nav class="tabs">
    <button data-tab="open" id="tab-open" class="active">المتاحة</button>
    <button data-tab="mine" id="tab-mine">طلباتي</button>
    <button data-tab="earn" id="tab-earn">أرباحي</button>
  </nav>
  <main>
    <div id="sec-open" style="display:grid;gap:14px"></div>
    <div id="sec-mine" class="hidden" style="display:grid;gap:14px"></div>
    <div id="sec-earn" class="hidden">
      <div class="card">
        <p class="muted">أرباحك من الطلبات المكتملة (ثلثين أجرة التوصيل)</p>
        <div id="earnNum" class="earn-num">0 جنيه</div>
        <p class="muted" id="doneCount"></p>
      </div>
    </div>
  </main>
</section>

<!-- فورم الطلب (بيتنقل للشاشة المناسبة) -->
<section id="orderSection" class="card">
  <h3>اطلب توصيل</h3>
  <form id="orderForm">
    <textarea id="items" placeholder="اكتب الأصناف، مثال: عيش 5، لبن، فراخ" required></textarea>
    <input id="address" placeholder="العنوان بالتفصيل" required>
    <input id="budget" type="number" min="0" placeholder="ميزانية تقريبية (جنيه)">
    <button class="btn" type="submit">إرسال الطلب</button>
  </form>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, where, onSnapshot, updateDoc, runTransaction, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC3jlhf1gZKRj-mn2a-Gb6VvARouFvvL7A",
  authDomain: "delivery-app-1bb6a.firebaseapp.com",
  projectId: "delivery-app-1bb6a",
  storageBucket: "delivery-app-1bb6a.firebasestorage.app",
  messagingSenderId: "1003596310234",
  appId: "1:1003596310234:web:5940b3722174bf961e67e3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const DEFAULT_FEE = 30;           // أجرة التوصيل (الإدارة هتغيرها بعدين)
const AGENT_SHARE = 2 / 3;        // المندوب ياخد التلتين
const STATUS = { new:'جديد', accepted:'مقبول', out:'خرج للتوصيل', delivered:'تم التسليم', cancelled:'ملغي' };
const STEPS = ['new','accepted','out','delivered'];
const NEXT = { accepted:'out', out:'delivered' };

let me = null, profile = null, unsubs = [], mine = [], mode = 'login';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emailOf = phone => phone.replace(/\D/g,'') + '@delivery.app';
const tsOf = o => o.createdAt?.toMillis?.() ?? Date.now();

function toast(msg, cls = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + cls;
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 3500);
}

function beep() {
  try {
    const c = new AudioContext(), o = c.createOscillator();
    o.frequency.value = 880; o.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.25);
  } catch {}
}

function show(id) {
  ['authView','customerView','agentView'].forEach(v => {
    const el = $(v);
    el.classList.toggle('hidden', v !== id);
    if (v === id) { el.classList.remove('view'); void el.offsetWidth; el.classList.add('view'); }
  });
}

function countTo(el, to) {
  const t0 = performance.now();
  const step = t => {
    const p = Math.min((t - t0) / 900, 1);
    el.textContent = Math.round(to * p) + ' جنيه';
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ===== شاشة الدخول =====
function setMode(m) {
  mode = m;
  $('name').classList.toggle('hidden', m !== 'register');
  $('authBtn').textContent = m === 'login' ? 'دخول' : 'تسجيل حساب جديد';
  $('authTitle').textContent = m === 'login' ? 'دخول' : 'حساب جديد';
  $('toggleMode').textContent = m === 'login' ? 'مش عندك حساب؟ سجّل هنا' : 'عندك حساب؟ ادخل من هنا';
}
$('toggleMode').onclick = () => setMode(mode === 'login' ? 'register' : 'login');

function friendly(err) {
  const c = err.code || '';
  if (c.includes('email-already-in-use')) return 'الرقم ده متسجل قبل كده';
  if (c.includes('weak-password')) return 'الباسورد لازم 6 حروف أو أرقام على الأقل';
  if (c.includes('invalid-email')) return 'رقم التليفون مش صحيح';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'الرقم أو الباسورد غلط';
  return 'حصلت مشكلة، حاول تاني';
}

$('authForm').onsubmit = async e => {
  e.preventDefault();
  const phone = $('phone').value.replace(/\D/g, '');
  const pass = $('password').value;
  if (phone.length < 10) return toast('اكتب رقم تليفون صحيح');
  $('authBtn').disabled = true;
  try {
    if (mode === 'register') {
      const name = $('name').value.trim();
      if (!name) return toast('اكتب اسمك');
      const cred = await createUserWithEmailAndPassword(auth, emailOf(phone), pass);
      await setDoc(doc(db, 'users', cred.user.uid), { name, phone, role: 'customer', createdAt: serverTimestamp() });
    } else {
      await signInWithEmailAndPassword(auth, emailOf(phone), pass);
    }
  } catch (err) {
    toast(friendly(err));
  } finally {
    $('authBtn').disabled = false;
  }
};

// ===== الجلسة =====
onAuthStateChanged(auth, async user => {
  unsubs.forEach(u => u()); unsubs = []; mine = [];
  if (!user) { show('authView'); return; }
  me = user;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) { toast('الحساب ده مش مسجل في النظام'); await signOut(auth); return; }
  profile = { uid: user.uid, ...snap.data() };
  profile.role === 'agent' ? startAgent() : startCustomer();
});

// ===== العميل =====
function startCustomer() {
  $('welcome').textContent = 'أهلاً ' + profile.name;
  $('slotOrder').appendChild($('orderSection'));
  show('customerView');
  unsubs.push(onSnapshot(query(collection(db, 'orders'), where('customerId', '==', me.uid)), snap => {
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => tsOf(b) - tsOf(a));
    $('myOrders').innerHTML = list.length
      ? list.map((o, i) => orderCardCustomer(o, i)).join('')
      : '<p class="empty">مفيش طلبات لسه</p>';
  }));
}

function orderCardCustomer(o, i) {
  const idx = STEPS.indexOf(o.status);
  const pct = o.status === 'cancelled' ? 0 : ((idx + 1) / STEPS.length) * 100;
  return `
  <div class="card" style="animation-delay:${i * 0.07}s">
    <div class="row"><b>طلب #${esc(o.id.slice(-5))}</b><span class="tag ${o.status}">${STATUS[o.status]}</span></div>
    <p class="muted">🛒 ${esc(o.items)}</p>
    <p class="muted">📍 ${esc(o.address)}</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    ${o.status === 'new' ? `<button class="btn danger small" data-act="cancel" data-id="${o.id}">إلغاء الطلب</button>` : ''}
  </div>`;
}

// ===== فورم الطلب =====
$('orderForm').onsubmit = async e => {
  e.preventDefault();
  const items = $('items').value.trim();
  const address = $('address').value.trim();
  const budget = Number($('budget').value) || 0;
  if (!items || !address) return toast('اكتب الأصناف والعنوان');
  await addDoc(collection(db, 'orders'), {
    customerId: me.uid, customerName: profile.name, customerPhone: profile.phone,
    items, address, budget, deliveryFee: DEFAULT_FEE,
    status: 'new', agentId: null, agentName: null, declinedBy: [],
    createdAt: serverTimestamp()
  });
  e.target.reset();
  toast('تم إرسال طلبك ✅', 'ok');
};

// ===== المندوب =====
function startAgent() {
  $('agentName').textContent = profile.name;
  $('slotOrderA').appendChild($('orderSection'));
  tab('open');
  show('agentView');

  let ready = false;
  let open = [];
  unsubs.push(onSnapshot(query(collection(db, 'orders'), where('status', '==', 'new')), snap => {
    if (ready) {
      snap.docChanges().forEach(c => {
        const d = c.doc.data();
        if (c.type === 'added' && d.customerId !== me.uid && !(d.declinedBy || []).includes(me.uid)) {
          toast('🔔 فيه طلب جديد!');
          navigator.vibrate?.([200, 100, 200]);
          beep();
        }
      });
    }
    ready = true;
    open = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(o => o.customerId !== me.uid && !(o.declinedBy || []).includes(me.uid));
    $('sec-open').innerHTML = open.length
      ? open.map((o, i) => openCard(o, i)).join('')
      : '<p class="empty">مفيش طلبات متاحة دلوقتي</p>';
  }));

  unsubs.push(onSnapshot(query(collection(db, 'orders'), where('agentId', '==', me.uid)), snap => {
    mine = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => tsOf(b) - tsOf(a));
    $('sec-mine').innerHTML = mine.length
      ? mine.map((o, i) => mineCard(o, i)).join('')
      : '<p class="empty">مفيش طلبات معاك</p>';
    const done = mine.filter(o => o.status === 'delivered');
    const earn = done.reduce((s, o) => s + (o.deliveryFee || 0) * AGENT_SHARE, 0);
    $('doneCount').textContent = 'طلبات مكتملة: ' + done.length;
    countTo($('earnNum'), Math.round(earn));
  }));
}

function openCard(o, i) {
  return `
  <div class="card" style="animation-delay:${i * 0.07}s">
    <div class="row"><b>طلب جديد</b><span class="tag new">جديد</span></div>
    <p class="muted">🛒 ${esc(o.items)}</p>
    <p class="muted">📍 ${esc(o.address)}</p>
    <p class="muted">💰 ميزانية تقريبية: ${esc(o.budget || '—')} جنيه</p>
    <p class="muted">🛵 أجرة التوصيل: ${o.deliveryFee} جنيه (نصيبك ${Math.round(o.deliveryFee * AGENT_SHARE)})</p>
    <div class="actions">
      <button class="btn ok small" data-act="accept" data-id="${o.id}">قبول</button>
      <button class="btn grey small" data-act="ret" data-id="${o.id}">رجوع</button>
    </div>
  </div>`;
}

function mineCard(o, i) {
  const idx = STEPS.indexOf(o.status);
  const pct = o.status === 'cancelled' ? 0 : ((idx + 1) / STEPS.length) * 100;
  const nxt = NEXT[o.status];
  const label = o.status === 'accepted' ? 'خرجت للتوصيل' : 'تم التسليم';
  return `
  <div class="card" style="animation-delay:${i * 0.07}s">
    <div class="row"><b>${esc(o.customerName)}</b><span class="tag ${o.status}">${STATUS[o.status]}</span></div>
    <p class="muted">📞 ${esc(o.customerPhone)}</p>
    <p class="muted">🛒 ${esc(o.items)}</p>
    <p class="muted">📍 ${esc(o.address)}</p>
    <div class="bar"><div style="width:${pct}%"></div></div>
    ${nxt ? `<button class="btn small" data-act="next" data-id="${o.id}">${label}</button>` : ''}
  </div>`;
}

// ===== الإجراءات =====
async function acceptOrder(id) {
  const ref = doc(db, 'orders', id);
  try {
    await runTransaction(db, async tx => {
      const s = await tx.get(ref);
      if (!s.exists() || s.data().status !== 'new') throw new Error('taken');
      tx.update(ref, { status: 'accepted', agentId: me.uid, agentName: profile.name });
    });
    toast('تم قبول الطلب، روح خده 🛵', 'ok');
  } catch {
    toast('الطلب ده اتاخد قبلك 😅');
  }
}

const actions = {
  logout: () => signOut(auth),
  accept: id => acceptOrder(id),
  ret: id => updateDoc(doc(db, 'orders', id), { declinedBy: arrayUnion(me.uid) }),
  cancel: id => updateDoc(doc(db, 'orders', id), { status: 'cancelled' }),
  next: async id => {
    const o = mine.find(x => x.id === id);
    if (o && NEXT[o.status]) await updateDoc(doc(db, 'orders', id), { status: NEXT[o.status] });
  }
};

function tab(name) {
  ['open','mine','earn'].forEach(n => {
    $('sec-' + n).classList.toggle('hidden', n !== name);
    $('tab-' + n).classList.toggle('active', n === name);
  });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) return tab(t.dataset.tab);
  const b = e.target.closest('[data-act]');
  if (b) actions[b.dataset.act]?.(b.dataset.id);
});

setMode('login');
setTimeout(() => $('splash').classList.add('gone'), 1200);
</script>
</body>
</html>
