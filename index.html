<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتب السلطان</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/jpeg" href="1000115413.jpg">
<link rel="apple-touch-icon" href="1000115413.jpg">
<meta name="theme-color" content="#f5c400">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="السلطان">
<style>
:root{
  --bg:#fff9f3; --ink:#243447; --muted:#7a8799;
  --sage:#19b8a6; --sage2:#7fe0cf; --soft:#e6faf6; --sand:#fff4dc;
  --warm:#f29f2c; --danger:#ff6b7a; --ok:#2fbf7f; --line:#efeaf7;
  --pink:#ff7ab6; --sun:#ffd166;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:40px;animation:softIn .8s ease both}
.hidden{display:none!important}

/* ===== الحركات ===== */
@keyframes softIn{from{opacity:0}to{opacity:1}}
@keyframes rise{0%{opacity:0;transform:translateY(20px) scale(.96)}65%{opacity:1;transform:translateY(-4px) scale(1.01)}100%{opacity:1;transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

/* ===== شاشة الافتتاح ===== */
#splash{position:fixed;inset:0;background:linear-gradient(135deg,var(--sage),var(--sage2));display:grid;place-items:center;color:#fff;z-index:99;transition:opacity .8s ease}
#splash.gone{opacity:0;pointer-events:none}
#splash .logo{font-size:70px;text-align:center;animation:float 2.4s ease-in-out infinite}
#splash p{font-size:24px;font-weight:600;text-align:center;margin-top:10px;animation:rise .9s .2s both}

/* ===== الهيدر ===== */
header{background:linear-gradient(120deg,var(--sage),var(--sage2));color:#fff;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 26px 26px;box-shadow:0 10px 28px rgba(95,157,146,.25);position:sticky;top:0;z-index:5;animation:slideDown .6s ease both}
header h1{font-size:19px;font-weight:600}
header small{opacity:.85;display:block;margin-top:4px;font-size:13px}
.ghostBtn{background:transparent;border:1px solid rgba(255,255,255,.7);color:#fff;padding:7px 15px;border-radius:999px;cursor:pointer;font-size:14px;transition:background .3s}
.ghostBtn:hover{background:rgba(255,255,255,.18)}

main{padding:16px;display:grid;gap:16px;max-width:640px;margin:0 auto}

/* ===== الكروت ===== */
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 6px 22px rgba(38,54,58,.05);border:1px solid var(--line);animation:rise .55s cubic-bezier(.2,.7,.2,1) both;transition:box-shadow .35s}
.card:hover{box-shadow:0 12px 30px rgba(38,54,58,.09)}
.card h3{font-size:17px;font-weight:600;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:13.5px;line-height:1.8}
.empty{text-align:center;color:var(--muted);padding:26px}

/* ===== الحقول والزراير ===== */
input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;font-size:15px;background:#fcfefd;transition:border-color .35s,box-shadow .35s,background .35s}
input:focus,textarea:focus{outline:none;border-color:var(--sage2);box-shadow:0 0 0 4px rgba(140,195,182,.25);background:#fff}
textarea{min-height:80px;resize:vertical}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(120deg,var(--sage),var(--sage2));color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:transform .3s,box-shadow .3s,filter .3s}
.btn:hover{box-shadow:0 10px 22px rgba(25,184,166,.35);transform:translateY(-2px) scale(1.02)}
.btn:active{transform:scale(.97)}
.btn.small{width:auto;padding:8px 15px;font-size:13px;border-radius:999px}
.btn.ok{background:var(--ok)}
.btn.grey{background:#9aa8aa}
.btn.danger{background:var(--danger)}
.link{background:none;border:0;color:var(--sage);font-size:14px;cursor:pointer;margin-top:12px;text-decoration:underline}
button:disabled{opacity:.6}

/* ===== الطلبات ===== */
.tag{padding:4px 11px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--sage);white-space:nowrap}
.tag.new{background:var(--sun);color:#7a4d00;animation:wiggle 1.6s ease-in-out infinite}
.tag.accepted{background:#e9eef9;color:#4a67a8}
.tag.out{background:#f0ebf8;color:#7a5ea8}
.tag.delivered{background:#e4f3ec;color:#3f8a64}
.tag.cancelled{background:#f8e7e5;color:var(--danger)}
.bar{height:7px;background:var(--soft);border-radius:9px;overflow:hidden;margin:14px 0 10px}
.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--sage2));border-radius:9px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.list{display:grid;gap:14px}

/* ===== تبويبات المندوب ===== */
.tabs{display:flex;gap:6px;background:#fff;border-radius:999px;padding:5px;margin:16px 16px 0;box-shadow:0 4px 14px rgba(38,54,58,.05);border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .35s}
.tabs button.active{background:linear-gradient(120deg,var(--sage),var(--sage2));color:#fff;box-shadow:0 4px 12px rgba(95,157,146,.3)}

/* ===== الأرباح ===== */
.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pcard{background:linear-gradient(160deg,var(--soft),#fff);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.pcard:nth-child(2){animation-delay:.08s}
.pcard:nth-child(3){animation-delay:.16s}
.pcard span{color:var(--muted);font-size:12.5px}
.pcard b{display:block;font-size:22px;color:var(--sage);margin:6px 0 2px;font-weight:600}
.pcard em{display:block;font-style:normal;color:var(--warm);font-weight:600;font-size:14px;margin-top:6px}
.totalBox{background:var(--sand);border-radius:20px;padding:20px;text-align:center}
.totalBox span{color:var(--muted);font-size:13px}
.totalBox b{display:block;font-size:34px;color:var(--warm);margin-top:6px;font-weight:600}

/* ===== بانر الطلب الجديد ===== */
.banner{position:fixed;top:-140px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:460px;background:#fff;border:1px solid var(--sage2);border-radius:20px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:70;transition:top .55s cubic-bezier(.34,1.4,.64,1)}
.banner.show{top:14px;animation:pulseBanner 1.6s ease-in-out infinite}
.banner b{font-size:16px;color:var(--ink)}
.banner .muted{font-size:12.5px;margin-top:2px}
.banner .btns{display:flex;gap:6px;flex-shrink:0}
@keyframes pulseBanner{0%,100%{box-shadow:0 14px 34px rgba(38,54,58,.18)}50%{box-shadow:0 0 0 8px rgba(140,195,182,.28),0 14px 34px rgba(38,54,58,.18)}}

/* ===== إشعار ===== */
.toast{position:fixed;top:18px;left:50%;background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transform:translate(-50%,-12px);max-width:92%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0);transition:opacity .35s,transform .45s cubic-bezier(.34,1.4,.64,1)}
.toast.ok{background:var(--ok)}

/* ===== تسجيل الدخول ===== */
.authWrap{max-width:400px;margin:70px auto;padding:0 16px}
.authWrap .card{padding:28px}
.brand{text-align:center;margin-bottom:22px;animation:rise .7s ease both}
.brand .logo{font-size:48px;animation:float 3s ease-in-out infinite}
.brand p{color:var(--muted);margin-top:6px;font-size:14px}

/* ===== هوية مكتب السلطان ===== */
:root{--bg:#fffaf0;--ink:#141414;--muted:#7a7468;--sage:#d4a017;--sage2:#f5c400;--soft:#fff6d6;--sand:#fff3c4;--warm:#b8860b;--danger:#d9534f;--ok:#2e9e6a;--line:#eee6cf;--sun:#f5c400}
header{background:#141414;color:#fff;border-bottom:3px solid #f5c400;border-radius:0 0 26px 26px;box-shadow:0 10px 28px rgba(20,20,20,.28)}
header h1{color:#f5c400}
.btn{background:linear-gradient(120deg,#d4a017,#f5c400);color:#141414;font-weight:700}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.grey{background:#8a8f96;color:#fff}
.tabs button.active{background:linear-gradient(120deg,#d4a017,#f5c400);color:#141414;box-shadow:0 4px 12px rgba(245,196,0,.35)}
#splash{background:#141414;color:#f5c400}
#splash p{color:#f5c400}
.brandImg,.splashImg{width:130px;height:130px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;box-shadow:0 0 0 5px #f5c400,0 14px 36px rgba(0,0,0,.25);animation:float 3s ease-in-out infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash"><div><img class="splashImg" src="1000115413.jpg" alt="مكتب السلطان"><p>مكتب السلطان</p></div></div>
<div id="toast" class="toast"></div>
<div id="banner" class="banner"></div>

<!-- شاشة الدخول -->
<section id="authView" class="hidden">
  <div class="authWrap">
    <div class="brand"><img class="brandImg" src="1000115413.jpg" alt="مكتب السلطان"><p>ادخل برقمك وباسوردك</p></div>
    <form id="authForm" class="card">
      <h3 id="authTitle">دخول</h3>
      <input id="name" class="hidden" placeholder="اسمك">
      <input id="phone" type="tel" placeholder="رقم التليفون" required>
      <input id="password" type="password" placeholder="الباسورد (6 حروف أو أرقام على الأقل)" required minlength="6">
      <button id="authBtn" class="btn" type="submit">دخول</button>
      <div style="text-align:center"><button id="toggleMode" class="link" type="button">مش عندك حساب؟ سجّل هنا</button></div>
    </form>
  </div>
</section>

<!-- شاشة العميل -->
<section id="customerView" class="hidden">
  <header>
    <div><h1 id="welcome"></h1><small>حساب عميل</small></div>
    <button class="ghostBtn" data-act="logout">خروج</button>
  </header>
  <main>
    <div id="slotOrder"></div>
    <h3 style="margin-top:4px;font-size:17px;font-weight:600">طلباتي</h3>
    <div id="myOrders" class="list"></div>
  </main>
</section>

<!-- شاشة المندوب -->
<section id="agentView" class="hidden">
  <header>
    <div><h1 id="agentName"></h1><small>حساب مندوب</small></div>
    <button class="ghostBtn" data-act="logout">خروج</button>
  </header>
  <nav class="tabs">
    <button data-tab="open" id="tab-open" class="active">المتاحة</button>
    <button data-tab="mine" id="tab-mine">طلباتي</button>
    <button data-tab="earn" id="tab-earn">أرباحي</button>
  </nav>
  <main>
    <div id="slotOrderA"></div>
    <div id="sec-open" class="list"></div>
    <div id="sec-mine" class="list hidden"></div>
    <div id="sec-earn" class="hidden" style="display:grid;gap:14px">
      <div class="periods" id="earnPeriods"></div>
      <div class="totalBox">
        <span>إجمالي أرباحك من كل الطلبات المكتملة</span>
        <b id="earnTotal">0 جنيه</b>
        <p class="muted" id="doneCount" style="margin-top:6px"></p>
      </div>
    </div>
  </main>
</section>

<!-- فورم الطلب -->
<section id="orderSection" class="card hidden">
  <h3>اطلب توصيل</h3>
  <form id="orderForm">
    <textarea id="items" placeholder="اكتب الأصناف، مثال: عيش 5، لبن، فراخ" required></textarea>
    <input id="address" placeholder="العنوان بالتفصيل" required>
    <input id="budget" type="number" min="0" placeholder="ميزانية تقريبية (جنيه)">
    <button class="btn" type="submit">إرسال الطلب</button>
  </form>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, where, onSnapshot, updateDoc, runTransaction, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC3jlhf1gZKRj-mn2a-Gb6VvARouFvvL7A",
  authDomain: "delivery-app-1bb6a.firebaseapp.com",
  projectId: "delivery-app-1bb6a",
  storageBucket: "delivery-app-1bb6a.firebasestorage.app",
  messagingSenderId: "1003596310234",
  appId: "1:1003596310234:web:5940b3722174bf961e67e3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const DEFAULT_FEE = 30;
const AGENT_SHARE = 2 / 3;
const STATUS = { new:'جديد', accepted:'مقبول', out:'خرج للتوصيل', delivered:'تم التسليم', cancelled:'ملغي' };
const STEPS = ['new','accepted','out','delivered'];
const NEXT = { accepted:'out', out:'delivered' };
const PERIOD_LABEL = { day:'اليوم', week:'الأسبوع', month:'الشهر' };
const ADMIN_PHONE = '01010422493'; // رقم الإدارة للتواصل المباشر

let me = null, profile = null, unsubs = [], mine = [], open = [], mode = 'login';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emailOf = phone => phone.replace(/\D/g,'') + '@delivery.app';
const tsOf = o => o.createdAt?.toMillis?.() ?? Date.now();
// وقت التسليم: deliveredAt لو موجود، وإلا وقت إنشاء الطلب
const doneTime = o => o.deliveredAt?.toMillis?.() ?? o.createdAt?.toMillis?.() ?? 0;

function toast(msg, cls = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + cls;
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 3300);
}

// ===== رنين الطلب الجديد =====
let audioCtx = null, ringTimer = null, ringStopper = null;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// فتح الصوت أول ما المستخدم يلمس الشاشة (المتصفح بيمنع الصوت قبل كده)
document.addEventListener('click', () => { try { getAudio(); } catch {} }, { once: true });

function chime() {
  try {
    const c = getAudio();
    [0, 0.3, 0.6].forEach((t, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.value = i === 1 ? 1175 : 880;
      g.gain.setValueAtTime(0, c.currentTime + t);
      g.gain.linearRampToValueAtTime(0.4, c.currentTime + t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t + 0.25);
      o.connect(g).connect(c.destination);
      o.start(c.currentTime + t);
      o.stop(c.currentTime + t + 0.28);
    });
  } catch {}
}

function startRing(order) {
  stopRing();
  const b = $('banner');
  b.innerHTML = `
    <div>
      <b>🔔 طلب جديد!</b>
      <div class="muted">${esc(order.items)}</div>
      <div class="muted">📍 ${esc(order.address)}</div>
    </div>
    <div class="btns">
      <button class="btn small" data-act="seeOpen">اعرض</button>
      <button class="btn small grey" data-act="dismiss">تم</button>
    </div>`;
  b.classList.add('show');
  const ring = () => { chime(); navigator.vibrate?.([400, 200, 400, 200, 400]); };
  ring();
  ringTimer = setInterval(ring, 2500);
  // يوقف لوحده بعد دقيقة عشان ما يفضلش يرن للأبد
  ringStopper = setTimeout(stopRing, 60000);
}

function stopRing() {
  clearInterval(ringTimer); clearTimeout(ringStopper);
  ringTimer = null; ringStopper = null;
  navigator.vibrate?.(0);
  $('banner').classList.remove('show');
}

function show(id) {
  ['authView','customerView','agentView'].forEach(v => $(v).classList.toggle('hidden', v !== id));
  const el = $(id);
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
}

function periodStart(p) {
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  if (p === 'day') return today.getTime();
  if (p === 'week') {
    const d = new Date(today);
    d.setDate(d.getDate() - ((d.getDay() + 1) % 7)); // الأسبوع بيبدأ السبت
    return d.getTime();
  }
  return new Date(n.getFullYear(), n.getMonth(), 1).getTime();
}

function summarize(list, p) {
  const from = periodStart(p);
  const inP = list.filter(o => doneTime(o) >= from);
  return { count: inP.length, earn: inP.reduce((s, o) => s + (o.deliveryFee || 0) * AGENT_SHARE, 0) };
}

// ===== شاشة الدخول =====
function setMode(m) {
  mode = m;
  $('name').classList.toggle('hidden', m !== 'register');
  $('authBtn').textContent = m === 'login' ? 'دخول' : 'تسجيل حساب جديد';
  $('authTitle').textContent = m === 'login' ? 'دخول' : 'حساب جديد';
  $('toggleMode').textContent = m === 'login' ? 'مش عندك حساب؟ سجّل هنا' : 'عندك حساب؟ ادخل من هنا';
}
$('toggleMode').onclick = () => setMode(mode === 'login' ? 'register' : 'login');

function friendly(err) {
  const c = err.code || '';
  if (c.includes('email-already-in-use')) return 'الرقم ده متسجل قبل كده';
  if (c.includes('weak-password')) return 'الباسورد لازم 6 حروف أو أرقام على الأقل';
  if (c.includes('invalid-email')) return 'رقم التليفون مش صحيح';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'الرقم أو الباسورد غلط';
  return 'حصلت مشكلة، حاول تاني';
}

$('authForm').onsubmit = async e => {
  e.preventDefault();
  const phone = $('phone').value.replace(/\D/g, '');
  const pass = $('password').value;
  if (phone.length < 10) return toast('اكتب رقم تليفون صحيح');
  $('authBtn').disabled = true;
  try {
    if (mode === 'register') {
      const name = $('name').value.trim();
      if (!name) return toast('اكتب اسمك');
      const cred = await createUserWithEmailAndPassword(auth, emailOf(phone), pass);
      await setDoc(doc(db, 'users', cred.user.uid), { name, phone, role: 'customer', createdAt: serverTimestamp() });
    } else {
      await signInWithEmailAndPassword(auth, emailOf(phone), pass);
    }
  } catch (err) {
    toast(friendly(err));
  } finally {
    $('authBtn').disabled = false;
  }
};

// ===== الجلسة =====
onAuthStateChanged(auth, async user => {
  unsubs.forEach(u => u()); unsubs = []; mine = []; open = [];
  if (!user) { $('orderSection').classList.add('hidden'); show('authView'); return; }
  me = user;
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) { toast('الحساب ده مش مسجل في النظام'); await signOut(auth); return; }
  profile = { uid: user.uid, ...snap.data() };
  if (profile.role === 'disabled') {
    toast('الحساب ده موقوف، كلّم الإدارة');
    await signOut(auth);
    return;
  }
  profile.role === 'agent' ? startAgent() : startCustomer();
});

// ===== العميل =====
function startCustomer() {
  $('welcome').textContent = 'أهلاً ' + profile.name;
  $('slotOrder').appendChild($('orderSection'));
  $('orderSection').classList.remove('hidden');
  show('customerView');
  unsubs.push(onSnapshot(query(collection(db, 'orders'), where('customerId', '==', me.uid)), snap => {
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => tsOf(b) - tsOf(a));
    $('myOrders').innerHTML = list.length
      ? list.map((o, i) => orderCardCustomer(o, i)).join('')
      : '<p class="empty">مفيش طلبات لسه</p>';
    animateBars();
  }));
}

function orderCardCustomer(o, i) {
  const idx = STEPS.indexOf(o.status);
  const pct = o.status === 'cancelled' ? 0 : ((idx + 1) / STEPS.length) * 100;
  return `
  <div class="card" style="animation-delay:${i * .07}s">
    <div class="row"><b>طلب #${esc(o.id.slice(-5))}</b><span class="tag ${o.status}">${STATUS[o.status]}</span></div>
    <p class="muted">🛒 ${esc(o.items)}</p>
    <p class="muted">📍 ${esc(o.address)}</p>
    <div class="bar" data-w="${pct}"><div></div></div>
    ${o.status === 'delivered' && o.agentId ? (o.rating
      ? `<p class="muted">تقييمك للمندوب: ${'⭐'.repeat(o.rating)}</p>`
      : `<p class="muted">قيّم المندوب:</p><div class="actions">${[1,2,3,4,5].map(n => `<button class="btn grey small" data-act="rate" data-id="${o.id}" data-stars="${n}">${n} ⭐</button>`).join('')}</div>`) : ''}
    ${o.issue ? `<p class="muted" style="color:#b8860b">⚠️ مشكلتك: ${esc(o.issue)}</p>` : ''}
    <div class="actions">
      ${o.status === 'new' ? `<button class="btn danger small" data-act="cancel" data-id="${o.id}">إلغاء الطلب</button>` : ''}
      ${o.status !== 'cancelled' && o.status !== 'delivered' ? `<button class="btn grey small" data-act="report" data-id="${o.id}">⚠️ مشكلة في الطلب</button>` : ''}
      <a class="btn small" style="text-decoration:none" href="tel:+2${ADMIN_PHONE}">📞 كلّم الإدارة</a>
    </div>
  </div>`;
}

function animateBars() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar').forEach(b => { b.firstElementChild.style.width = b.dataset.w + '%'; });
  });
}

// ===== فورم الطلب =====
$('orderForm').onsubmit = async e => {
  e.preventDefault();
  const items = $('items').value.trim();
  const address = $('address').value.trim();
  const budget = Number($('budget').value) || 0;
  if (!items || !address) return toast('اكتب الأصناف والعنوان');
  await addDoc(collection(db, 'orders'), {
    customerId: me.uid, customerName: profile.name, customerPhone: profile.phone,
    items, address, budget, deliveryFee: DEFAULT_FEE,
    status: 'new', agentId: null, agentName: null, declinedBy: [],
    createdAt: serverTimestamp()
  });
  e.target.reset();
  toast('تم إرسال طلبك ✅', 'ok');
};

// ===== المندوب =====
function startAgent() {
  $('agentName').textContent = profile.name;
  $('slotOrderA').appendChild($('orderSection'));
  $('orderSection').classList.remove('hidden');
  tab('open');
  show('agentView');

  let ready = false;
  unsubs.push(onSnapshot(query(collection(db, 'orders'), where('status', '==', 'new')), snap => {
    if (ready) {
      snap.docChanges().forEach(c => {
        const d = c.doc.data();
        if (c.type === 'added' && d.customerId !== me.uid && !(d.declinedBy || []).includes(me.uid)) {
          startRing(d);
        }
      });
    }
    ready = true;
    open = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(o => o.customerId !== me.uid && !(o.declinedBy || []).includes(me.uid));
    $('sec-open').innerHTML = open.length
      ? open.map((o, i) => openCard(o, i)).join('')
      : '<p class="empty">مفيش طلبات متاحة دلوقتي</p>';
  }));

  unsubs.push(onSnapshot(query(collection(db, 'orders'), where('agentId', '==', me.uid)), snap => {
    mine = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => tsOf(b) - tsOf(a));
    $('sec-mine').innerHTML = mine.length
      ? mine.map((o, i) => mineCard(o, i)).join('')
      : '<p class="empty">مفيش طلبات معاك</p>';
    renderEarn();
    animateBars();
  }));
}

function renderEarn() {
  const done = mine.filter(o => o.status === 'delivered');
  $('earnPeriods').innerHTML = ['day','week','month'].map(p => {
    const s = summarize(done, p);
    return `<div class="pcard"><span>${PERIOD_LABEL[p]}</span><b>${s.count}</b><small>طلب</small><em>${Math.round(s.earn)} جنيه</em></div>`;
  }).join('');
  const total = summarize(done, 'all');
  $('earnTotal').textContent = Math.round(done.reduce((s, o) => s + (o.deliveryFee || 0) * AGENT_SHARE, 0)) + ' جنيه';
  $('doneCount').textContent = 'عدد الطلبات المكتملة: ' + done.length;
}

function openCard(o, i) {
  return `
  <div class="card" style="animation-delay:${i * .07}s">
    <div class="row"><b>طلب جديد</b><span class="tag new">جديد</span></div>
    <p class="muted">🛒 ${esc(o.items)}</p>
    <p class="muted">📍 ${esc(o.address)}</p>
    <p class="muted">💰 ميزانية تقريبية: ${esc(o.budget || '—')} جنيه</p>
    <p class="muted">🛵 أجرة التوصيل: ${o.deliveryFee} جنيه (نصيبك ${Math.round(o.deliveryFee * AGENT_SHARE)})</p>
    <div class="actions">
      <button class="btn ok small" data-act="accept" data-id="${o.id}">قبول</button>
      <button class="btn grey small" data-act="ret" data-id="${o.id}">رجوع</button>
    </div>
  </div>`;
}

function mineCard(o, i) {
  const idx = STEPS.indexOf(o.status);
  const pct = o.status === 'cancelled' ? 0 : ((idx + 1) / STEPS.length) * 100;
  const nxt = NEXT[o.status];
  const label = o.status === 'accepted' ? 'خرجت للتوصيل' : 'تم التسليم';
  return `
  <div class="card" style="animation-delay:${i * .07}s">
    <div class="row"><b>${esc(o.customerName)}</b><span class="tag ${o.status}">${STATUS[o.status]}</span></div>
    <p class="muted">📞 ${esc(o.customerPhone)}</p>
    <p class="muted">🛒 ${esc(o.items)}</p>
    <p class="muted">📍 ${esc(o.address)}</p>
    <div class="bar" data-w="${pct}"><div></div></div>
    ${nxt ? `<button class="btn small" data-act="next" data-id="${o.id}">${label}</button>` : ''}
  </div>`;
}

// ===== الإجراءات =====
async function acceptOrder(id) {
  const ref = doc(db, 'orders', id);
  try {
    await runTransaction(db, async tx => {
      const s = await tx.get(ref);
      if (!s.exists() || s.data().status !== 'new') throw new Error('taken');
      tx.update(ref, { status: 'accepted', agentId: me.uid, agentName: profile.name });
    });
    stopRing();
    toast('تم قبول الطلب، روح خده 🛵', 'ok');
  } catch {
    toast('الطلب ده اتاخد قبلك 😅');
  }
}

const actions = {
  logout: () => signOut(auth),
  seeOpen: () => { tab('open'); stopRing(); },
  dismiss: () => stopRing(),
  accept: id => acceptOrder(id),
  ret: id => updateDoc(doc(db, 'orders', id), { declinedBy: arrayUnion(me.uid) }),
  cancel: id => updateDoc(doc(db, 'orders', id), { status: 'cancelled' }),
  rate: async (id, el) => {
    const stars = Number(el.dataset.stars);
    await updateDoc(doc(db, 'orders', id), { rating: stars, ratedAt: serverTimestamp() });
    toast('شكراً على تقييمك ⭐', 'ok');
  },
  report: async id => {
    const txt = prompt('اكتب المشكلة باختصار (تأخير، طلب ناقص، ...)');
    if (!txt || !txt.trim()) return;
    await updateDoc(doc(db, 'orders', id), { issue: txt.trim(), issueAt: serverTimestamp() });
    toast('اتبعتت للإدارة، هيتواصلوا معاك ✅', 'ok');
  },
  next: async id => {
    const o = mine.find(x => x.id === id);
    if (!o || !NEXT[o.status]) return;
    const patch = { status: NEXT[o.status] };
    if (patch.status === 'delivered') patch.deliveredAt = serverTimestamp();
    await updateDoc(doc(db, 'orders', id), patch);
    toast(patch.status === 'delivered' ? 'تم التسليم ✅ تمام' : 'تم تحديث الحالة', 'ok');
  }
};

function tab(name) {
  ['open','mine','earn'].forEach(n => {
    $('sec-' + n).classList.toggle('hidden', n !== name);
    $('tab-' + n).classList.toggle('active', n === name);
  });
  if (name === 'earn') renderEarn();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) return tab(t.dataset.tab);
  const b = e.target.closest('[data-act]');
  if (b) actions[b.dataset.act]?.(b.dataset.id, b);
});

setMode('login');
setTimeout(() => $('splash').classList.add('gone'), 1400);
</script>
</body>
</html>
